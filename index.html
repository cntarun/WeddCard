<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Link previews (WhatsApp, iMessage, social) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Rozha One (names) · EB Garamond (text) · Gurajada (Telugu) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Gurajada&family=Rozha+One&display=swap"
    />
    <link rel="preload" as="image" href="art/arch.webp" />
    <link rel="preload" as="image" href="art/ganesha.webp" />
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main class="section">
        <p>%DESCRIPTION%</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
