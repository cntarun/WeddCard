<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <meta name="theme-color" content="#fbf6ec" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Link previews (WhatsApp, iMessage, social) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts are self-hosted (src/fonts.css); the opening screen's two are preloaded -->
    <link rel="preload" as="font" type="font/woff2" href="fonts/fraunces-600-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/jost-latin.woff2" crossorigin />
    <link rel="preload" as="image" href="art/arch.webp" />
    <link rel="preload" as="image" href="art/ganesha.webp" />
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main class="section">
        <p>%DESCRIPTION%</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
